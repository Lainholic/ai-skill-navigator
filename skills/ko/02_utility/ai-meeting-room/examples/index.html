<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI 회의실</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><div class="brand">AI 회의실 <span>로컬 회의</span></div><span class="header-note">의견을 나누고, 기록을 남깁니다</span></header>
<main><aside><div class="section-heading"><h1>회의 준비</h1><span>01</span></div><label for="topic">회의 주제</label><textarea id="topic" placeholder="어떤 이야기를 나누고 싶으신가요?" maxlength="5000"></textarea>
<div class="row"><label for="rounds">총 턴 수 (참여자 모두 1회 발언 = 1턴)</label><input id="rounds" type="number" min="1" max="20" value="2"><label for="mode">진행 방식</label><select id="mode"><option value="auto">자동 진행 · 매 턴 요약 후 계속</option><option value="manual">직접 진행 · 매 턴 확인 후 계속</option></select><label for="on-error">응답 오류가 나면</label><select id="on-error"><option value="ask">매번 물어보기</option><option value="stop">회의 중단</option><option value="continue">다음 단계로 계속</option></select></div>
<div class="section-heading participant-heading"><h2>참여자</h2><button id="add" type="button" class="text-button">+ 추가</button></div><div id="participants"></div>
<p class="hint">테스트 모드는 실제 AI를 호출하지 않습니다. API 키는 저장하지 않고 현재 창에서만 사용합니다.</p><button id="start" class="primary" type="button">회의 시작</button><button id="stop" class="secondary" type="button" hidden>회의 중단</button><p id="setup-error" class="error" role="alert"></p></aside>
<section class="meeting"><div class="meeting-top"><div><span class="eyebrow">MEETING ROOM</span><h2 id="meeting-title">새로운 회의</h2><p id="status" role="status" aria-live="polite">주제와 참여자를 정하고 회의를 시작하세요.</p><p id="cost" aria-live="polite">예상 비용: 회의 시작 전</p><p class="hint">제공사 사용량과 입력한 단가로 계산한 추정치입니다. 실제 청구액은 다를 수 있습니다.</p></div><button id="download" class="secondary" disabled>회의록 저장</button></div><div id="manual-controls" hidden><label for="guidance">다음 턴에 전달할 말씀 (선택)</label><textarea id="guidance" maxlength="5000" placeholder="추가 질문이나 방향을 입력하세요"></textarea><button id="next" class="primary" type="button">다음 턴 진행</button></div><div class="timeline-head"><strong>회의 기록</strong><span id="count">발언 0개</span></div><div id="transcript" aria-live="polite"><div class="empty"><div class="empty-mark">“ ”</div><strong>여기에 회의가 기록됩니다</strong><p>각 참여자의 의견과 이어지는 대화를 확인하세요.</p></div></div></section></main>
<template id="participant-template"><div class="participant"><div class="participant-top"><strong class="participant-title"></strong><button type="button" class="remove text-button">삭제</button></div><label>표시 이름<input class="name" maxlength="40" placeholder="예: 기획 담당"></label><label>연결 제공사<select class="provider"><option value="demo">테스트 모드 (실제 AI 아님)</option><option value="openai">OpenAI API</option><option value="deepseek">DeepSeek API</option><option value="nebius">Nebius API</option><option value="azure">Azure OpenAI</option><option value="vertex">Vertex AI Express</option></select></label><div class="credentials" hidden><label class="endpoint-field" hidden>Azure 리소스 주소<input class="endpoint" autocomplete="off" placeholder="https://이름.openai.azure.com"></label><label>실제 AI 모델명 / Azure 배포명<input class="model" autocomplete="off" placeholder="사용 가능한 모델명 입력"></label><label>API 키<input class="key" type="password" autocomplete="off" placeholder="API 키 입력"></label><details><summary>비용 단가 입력 (선택)</summary><p class="hint">제공사의 모델별 USD 단가입니다. 비우면 비용 미확인으로 표시됩니다.</p><button class="price-nebius secondary" type="button" hidden>Nebius 단가 불러오기</button><p class="price-status hint" role="status"></p><label>입력 100만 토큰당 $<input class="input-price" type="number" min="0" step="any" placeholder="예: 0.50"></label><label>출력 100만 토큰당 $<input class="output-price" type="number" min="0" step="any" placeholder="예: 1.50"></label></details></div></div></template></body></html>
